name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/example/typecutter app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = "TypeCPowerCutter"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.typecutter'
              compileSdk 35

              defaultConfig {
                  applicationId "com.example.typecutter"
                  minSdk 31
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Type-C 断电"
                  android:theme="@android:style/Theme.DeviceDefault.DayNight">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />
                  <meta-data
                      android:name="xposeddescription"
                      android:value="手动切断 Type-C VBUS 给移动硬盘断电" />
                  <meta-data
                      android:name="xposedminversion"
                      android:value="82" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/xposed_init <<'EOF'
          com.example.typecutter.HookEntry
          EOF

          cat > app/src/main/assets/cutter.sh <<'EOF'
          #!/system/bin/sh

          ACTION="$1"

          discover_nodes() {
              find /sys -type f \( -iname "*otg*" -o -iname "*vbus*" \) 2>/dev/null | while read -r f; do
                  [ -w "$f" ] && echo "$f"
              done
          }

          write_candidates() {
              local node="$1"
              local action="$2"
              case "$action" in
                  off)
                      for val in 0 disabled sink off; do
                          if echo "$val" > "$node" 2>/dev/null; then
                              echo "WROTE $val -> $node"
                              return 0
                          fi
                      done
                      ;;
                  on)
                      for val in 1 enabled source dual on; do
                          if echo "$val" > "$node" 2>/dev/null; then
                              echo "WROTE $val -> $node"
                              return 0
                          fi
                      done
                      ;;
              esac
              return 1
          }

          case "$ACTION" in
            off)
              sync
              for m in /mnt/media_rw/*; do
                [ -d "$m" ] && umount -l "$m" 2>/dev/null
              done

              TRIED=""
              SUCCESS=0
              NODES=$(discover_nodes)

              if [ -z "$NODES" ]; then
                  echo "ERR: no writable otg/vbus node found at all"
                  exit 1
              fi

              for node in $NODES; do
                  if write_candidates "$node" "off"; then
                      TRIED="$TRIED $node"
                      SUCCESS=1
                  fi
              done

              if [ "$SUCCESS" = "1" ]; then
                  echo "OK_TRIED:$TRIED"
              else
                  echo "ERR: found writable nodes but none accepted off value: $NODES"
                  exit 1
              fi
              ;;

            on)
              TRIED=""
              NODES=$(discover_nodes)
              for node in $NODES; do
                  if write_candidates "$node" "on"; then
                      TRIED="$TRIED $node"
                  fi
              done
              echo "OK_TRIED:$TRIED"
              ;;

            *)
              echo "ERR: unknown action"
              exit 1
              ;;
          esac
          EOF

          cat > app/src/main/java/com/example/typecutter/HookEntry.kt <<'EOF'
          package com.example.typecutter

          import de.robv.android.xposed.IXposedHookLoadPackage
          import de.robv.android.xposed.callbacks.XC_LoadPackage

          class HookEntry : IXposedHookLoadPackage {
              override fun handleLoadPackage(lpparam: XC_LoadPackage.LoadPackageParam) {
              }
          }
          EOF

          cat > app/src/main/java/com/example/typecutter/PowerCutter.kt <<'EOF'
          package com.example.typecutter

          import android.content.Context
          import android.content.res.AssetManager
          import java.io.BufferedReader
          import java.io.File
          import java.io.InputStreamReader

          object PowerCutter {

              @Volatile
              private var appContext: Context? = null

              fun init(ctx: Context) {
                  appContext = ctx.applicationContext
              }

              fun execute(assets: AssetManager, action: String): String {
                  return try {
                      val ctx = appContext ?: return "ERR: context null"
                      val script = File(ctx.filesDir, "cutter.sh")

                      if (!script.exists()) {
                          assets.open("cutter.sh").use { input ->
                              script.outputStream().use { output -> input.copyTo(output) }
                          }
                          script.setExecutable(true)
                      }

                      val cmd = arrayOf("su", "-c", "sh ${script.absolutePath} $action")
                      val process = Runtime.getRuntime().exec(cmd)

                      val out = BufferedReader(InputStreamReader(process.inputStream)).readText()
                      val err = BufferedReader(InputStreamReader(process.errorStream)).readText()
                      process.waitFor()

                      out.ifBlank { err.ifBlank { "OK" } }
                  } catch (e: Exception) {
                      "ERR: ${e.message}"
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/typecutter/MainActivity.kt <<'EOF'
          package com.example.typecutter

          import android.app.Activity
          import android.os.Build
          import android.os.Bundle
          import android.view.WindowInsets
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  PowerCutter.init(this)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }

                  status = TextView(this).apply {
                      text = "就绪"
                      textSize = 16f
                  }

                  val btnOff = Button(this).apply {
                      text = "断电（切断 VBUS）"
                      setOnClickListener { runAction("off") }
                  }

                  val btnOn = Button(this).apply {
                      text = "恢复供电"
                      setOnClickListener { runAction("on") }
                  }

                  layout.addView(status)
                  layout.addView(btnOff)
                  layout.addView(btnOn)

                  val scroll = ScrollView(this).apply {
                      addView(layout)
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      scroll.setOnApplyWindowInsetsListener { v, insets ->
                          val bars = insets.getInsets(WindowInsets.Type.systemBars())
                          v.setPadding(0, bars.top, 0, bars.bottom)
                          insets
                      }
                  }

                  setContentView(scroll)
              }

              private fun runAction(action: String) {
                  status.text = "执行中..."
                  Thread {
                      val result = PowerCutter.execute(assets, action)
                      runOnUiThread {
                          status.text = result
                          Toast.makeText(this, result, Toast.LENGTH_SHORT).show()
                      }
                  }.start()
              }
          }
          EOF

      - name: Build
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TypeCPowerCutter-debug
          path: app/build/outputs/apk/debug/app-debug.apk
